name: Deploy to ringtable.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ringtable
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Trim accidental whitespace/newlines from secrets
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      # Node listen port on server (Apache /backend proxies here)
      BACKEND_PORT: "5059"
      REMOTE_WEBROOT: /home/limiria/public_html/ringtable.io
      REMOTE_BACKEND: /home/limiria/public_html/ringtable.io/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            export VITE_API_URL="http://ringtable.io/backend"
          fi
          echo "Building with VITE_API_URL=$VITE_API_URL"
          npm run build

      - name: Check deploy secrets
        env:
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          SSH_HOST="$(echo -n "$SSH_HOST" | tr -d '\r\n ')"
          SSH_USER="$(echo -n "$SSH_USER" | tr -d '\r\n ')"
          SSH_PORT="${SSH_PORT:-22}"
          SSH_PORT="$(echo -n "$SSH_PORT" | tr -d '\r\n ')"
          echo "SSH_HOST length: ${#SSH_HOST}"
          echo "SSH_USER length: ${#SSH_USER}"
          echo "SSH_PORT: $SSH_PORT"
          echo "HAS_SSH_KEY: $HAS_SSH_KEY"
          if [ -z "$SSH_HOST" ]; then echo "::error::SSH_HOST secret is empty"; exit 1; fi
          if [ -z "$SSH_USER" ]; then echo "::error::SSH_USER secret is empty"; exit 1; fi
          if [ "$HAS_SSH_KEY" != "true" ]; then echo "::error::SSH_PRIVATE_KEY secret is empty"; exit 1; fi
          echo "Secrets present. Continuing."
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          SSH_OPTS="-p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes"
          echo "Attempting SSH connection to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}..."
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" 'echo "SSH_OK - connected as $(whoami) on $(hostname) at $(date -u)"'

      - name: Ensure remote dirs
        run: |
          ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${REMOTE_WEBROOT}' '${REMOTE_BACKEND}'"

      - name: Deploy frontend (dist → public_html/ringtable.io)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=30" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'backend' \
            dist/ "${SSH_USER}@${SSH_HOST}:${REMOTE_WEBROOT}/"

      - name: Deploy backend (backend → public_html/ringtable.io/backend)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=30" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads' \
            --exclude 'backend_log.txt' \
            --exclude 'scratch' \
            backend/ "${SSH_USER}@${SSH_HOST}:${REMOTE_BACKEND}/"

      - name: Point /backend .htaccess at Node port
        run: |
          printf '%s\n' \
            'RewriteEngine On' \
            "# Always proxy — do not expose source files from public_html" \
            "RewriteRule ^(.*)$ http://127.0.0.1:${BACKEND_PORT}/\$1 [P,L]" \
            | ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              "${SSH_USER}@${SSH_HOST}" "cat > '${REMOTE_BACKEND}/.htaccess'"

      - name: Install backend deps + PM2 start/restart
        run: |
          ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "${SSH_USER}@${SSH_HOST}" "BACKEND_PORT=${BACKEND_PORT} REMOTE_BACKEND=${REMOTE_BACKEND} bash -s" << 'EOF'
          set -e
          cd "$REMOTE_BACKEND"
          # Prefer full install so new deps (pm2) land even if lock is stale
          npm install --omit=dev

          # Run migrations and seed admin user (.env must already exist on server)
          node scripts/migrate.js || true
          node scripts/seed-admin.js || true

          # Use local pm2 only (parent public_html can have a broken pm2 on PATH)
          PM2="./node_modules/.bin/pm2"
          if [ ! -x "$PM2" ]; then
            npm install pm2@5.4.3 --no-fund --no-audit
          fi
          if [ ! -x "$PM2" ]; then
            echo "::error::Local pm2 binary missing after npm install"
            ls -la node_modules/.bin/pm2 || true
            exit 1
          fi

          # Keep PORT in .env in sync with Apache proxy
          if [ -f .env ]; then
            if grep -q '^PORT=' .env; then
              sed -i "s/^PORT=.*/PORT=${BACKEND_PORT}/" .env
            else
              echo "PORT=${BACKEND_PORT}" >> .env
            fi
            if ! grep -q '^PUBLIC_APP_URL=' .env; then
              echo "PUBLIC_APP_URL=http://ringtable.io" >> .env
            fi
            if ! grep -q '^PUBLIC_API_URL=' .env; then
              echo "PUBLIC_API_URL=http://ringtable.io/backend" >> .env
            fi
          else
            echo "::warning::backend/.env missing on server — create it before API will work"
          fi

          # Release port if held by an orphan process and restart clean
          fuser -k "${BACKEND_PORT}/tcp" 2>/dev/null || true
          "$PM2" delete ringtable-api 2>/dev/null || true
          PORT="$BACKEND_PORT" "$PM2" start src/index.js --name ringtable-api --update-env
          "$PM2" save
          "$PM2" status ringtable-api
          echo "Backend deploy finished at $(date -u)"
          EOF
